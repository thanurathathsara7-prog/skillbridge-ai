name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies & Build Web App
      run: |
        npm install
        npm run build
      # ඔයාගේ files වැටිලා තියෙන්නේ වෙනම folder එකක් ඇතුළේ නම්, පහළ line එකේ "folder-name" වෙනුවට ඒ නම දාන්න (නැත්නම් මේක මෙහෙමම තියන්න):
      # working-directory: ./folder-name

    - name: Add Capacitor Android
      run: |
        npx cap init SkillBridge com.skillbridge.app --web-dir dist --yes
        npx cap add android
        npx cap sync

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
